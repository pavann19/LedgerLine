spring:
  application:
    name: ledger-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerline}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

ledger:
  security:
    mode: ${SECURITY_MODE:local-jwt}
    jwt-secret: ${JWT_SECRET:}
    issuer-uri: ${OAUTH2_ISSUER_URI:}
    jwk-set-uri: ${OAUTH2_JWK_SET_URI:}
    audience: ${OAUTH2_AUDIENCE:}
    oauth2:
      authorization-url: ${OAUTH2_AUTHORIZATION_URL:}
      token-url: ${OAUTH2_TOKEN_URL:}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-second: ${RATE_LIMIT_REQUESTS_PER_SECOND:500}
      burst: ${RATE_LIMIT_BURST:1000}
      max-principals: ${RATE_LIMIT_MAX_PRINCIPALS:10000}
      idle-seconds: ${RATE_LIMIT_IDLE_SECONDS:300}
  transfer:
    default-variant: VARIANT_1_PESSIMISTIC
  kafka:
    transfers-topic: ledger.transfers.v1
  outbox:
    relay:
      enabled: true
      delay-ms: 500
      batch-size: 50

springdoc:
  swagger-ui:
    persist-authorization: false
    oauth:
      client-id: ${OAUTH2_SWAGGER_CLIENT_ID:}
      use-pkce-with-authorization-code-grant: true
