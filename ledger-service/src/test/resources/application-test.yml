spring:
  application:
    name: ledger-service-test
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        enable.idempotence: false
ledger:
  outbox:
    relay:
      enabled: false # disable background poller in pure tests
