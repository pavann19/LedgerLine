spring:
  application:
    name: projection-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerline}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_projection
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledgerline-projection
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

server:
  shutdown: graceful
  port: ${PORT:8081}

projection:
  security:
    mode: ${SECURITY_MODE:local-jwt}
    jwt-secret: ${JWT_SECRET:}
    issuer-uri: ${OAUTH2_ISSUER_URI:}
    jwk-set-uri: ${OAUTH2_JWK_SET_URI:}
    audience: ${OAUTH2_AUDIENCE:}
    oauth2:
      authorization-url: ${OAUTH2_AUTHORIZATION_URL:}
      token-url: ${OAUTH2_TOKEN_URL:}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-second: ${RATE_LIMIT_REQUESTS_PER_SECOND:500}
      burst: ${RATE_LIMIT_BURST:1000}
      max-principals: ${RATE_LIMIT_MAX_PRINCIPALS:10000}
      idle-seconds: ${RATE_LIMIT_IDLE_SECONDS:300}
  kafka:
    transfers-topic: ledger.transfers.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    persist-authorization: false
    oauth:
      client-id: ${OAUTH2_SWAGGER_CLIENT_ID:}
      use-pkce-with-authorization-code-grant: true
