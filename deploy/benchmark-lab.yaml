# NEW project name and fresh storage only; never use deploy/compose.yaml volumes.
# Operator/harness supplies a private env file and the verified copied artifacts.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "2"}
x-app: &app
  image: ${LAB_JAVA_IMAGE:?pinned Java image required}
  pull_policy: never
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  restart: "on-failure:3"
  stop_grace_period: 45s
  logging: *logging
  networks: [lab, edge]
  environment: &app-env
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerline
    SPRING_DATASOURCE_USERNAME: lab_owner
    SPRING_DATASOURCE_PASSWORD: ${LAB_DB_PASSWORD:?required}
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
    JWT_SECRET: ${LAB_JWT_SECRET:?required}
    RECONCILIATION_ENABLED: "true"
    RECONCILIATION_JDBC_URL: jdbc:postgresql://postgres:5432/ledgerline?connectTimeout=3&socketTimeout=3
    RECONCILIATION_USERNAME: lab_reader
    RECONCILIATION_PASSWORD: ${LAB_READER_PASSWORD:?required}
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
services:
  postgres:
    image: ${LAB_POSTGRES_IMAGE:?pinned PostgreSQL image required}
    pull_policy: never
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: lab_owner
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?required}
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, track_io_timing=on]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 600m
    cpus: ${LAB_POSTGRES_CPUS:-1}
    logging: *logging
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab_owner -d ledgerline"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: ${LAB_KAFKA_IMAGE:?pinned Kafka image required}
    pull_policy: never
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_LOG_SEGMENT_BYTES: 8388608
      KAFKA_LOG_RETENTION_HOURS: 48
    volumes: [kafkadata:/var/lib/kafka/data]
    mem_limit: 700m
    cpus: ${LAB_KAFKA_CPUS:-0.5}
    logging: *logging
    networks: [lab]
  ledger-service:
    <<: *app
    command: [java, -Xms128m, -Xmx512m, -jar, /app/app.jar]
    volumes: ["${LAB_ARTIFACTS:?required}/ledger-service.jar:/app/app.jar:ro"]
    ports: ["127.0.0.1::8080"]
    mem_limit: 768m
    cpus: ${LAB_LEDGER_CPUS:-1}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${LAB_LEDGER_POOL_SIZE:-12}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      LEDGER_OUTBOX_RELAY_DELAY_MS: 200
      LEDGER_OUTBOX_RELAY_BATCH_SIZE: 100
      SPRING_KAFKA_PRODUCER_PROPERTIES_LINGER_MS: 0
      SPRING_KAFKA_PRODUCER_PROPERTIES_BATCH_SIZE: 32768
    depends_on:
      postgres: {condition: service_healthy}
  projection-service:
    <<: *app
    command: [java, -Xms128m, -Xmx384m, -jar, /app/app.jar]
    volumes: ["${LAB_ARTIFACTS:?required}/projection-service.jar:/app/app.jar:ro"]
    ports: ["127.0.0.1::8081"]
    mem_limit: 640m
    cpus: 0.75
    environment:
      <<: *app-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 6
    depends_on:
      postgres: {condition: service_healthy}
      ledger-service: {condition: service_started}
volumes:
  pgdata:
  kafkadata:
networks:
  lab:
    internal: true
  edge:
    # Only app services attach here; published APIs bind explicitly to loopback.
