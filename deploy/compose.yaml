# Authentication/rate-limit settings shared by both API containers.
# Local mode rejects an empty secret at application startup; OAuth2 mode does not use one.
x-api-security-environment: &api-security-environment
  SECURITY_MODE: ${SECURITY_MODE:-local-jwt}
  JWT_SECRET: ${JWT_SECRET:-}
  OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-}
  OAUTH2_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-}
  OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-}
  OAUTH2_AUTHORIZATION_URL: ${OAUTH2_AUTHORIZATION_URL:-}
  OAUTH2_TOKEN_URL: ${OAUTH2_TOKEN_URL:-}
  OAUTH2_SWAGGER_CLIENT_ID: ${OAUTH2_SWAGGER_CLIENT_ID:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUESTS_PER_SECOND: ${RATE_LIMIT_REQUESTS_PER_SECOND:-500}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-1000}
  RATE_LIMIT_MAX_PRINCIPALS: ${RATE_LIMIT_MAX_PRINCIPALS:-10000}
  RATE_LIMIT_IDLE_SECONDS: ${RATE_LIMIT_IDLE_SECONDS:-300}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerline-postgres
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerline"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: ledgerline-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 15s
      start_period: 60s
      retries: 12

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: ledgerline-toxiproxy
    ports:
      - "127.0.0.1:8474:8474" # Management API
      - "127.0.0.1:5433:5433" # Proxied Postgres port for chaos testing
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ledgerline-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ledgerline-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  ledger-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ledger
    container_name: ledgerline-ledger-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *api-security-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerline
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_OUTBOX_RELAY_ENABLED: "true"
      LEDGER_OUTBOX_RELAY_DELAY_MS: 200
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  projection-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.projection
    container_name: ledgerline-projection-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *api-security-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerline
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      ledger-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pgdata:
