name: CI

on:
  push:
    branches: [ main, master, financial-release-audit ]
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (all refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan all history with narrowly scoped fixture allowlist
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --log-opts=--all --config /repo/.gitleaks.toml --redact --no-banner
      - name: Verify fixture allowlist negative controls
        run: python3 scripts/test_secret_scan_policy.py

  test:
    name: Build & Invariant Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build, Test & Generate Coverage
        run: ./mvnw clean verify -Pcoverage --batch-mode

      - name: Verify image scan policy negative controls
        run: python3 scripts/test_image_scan_policy.py

      - name: Archive Coverage Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  supply-chain:
    name: Images, SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: ledger
            dockerfile: deploy/Dockerfile.ledger
          - service: projection
            dockerfile: deploy/Dockerfile.projection
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ledgerline/${{ matrix.service }}:${{ github.sha }}
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ledgerline/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ matrix.service }}-sbom.spdx.json
      - name: Download MVC applicability regression results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: surefire-reports
          path: .security-test-evidence
      - name: Collect unfiltered image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ledgerline/${{ matrix.service }}:${{ github.sha }}
          format: json
          output: ${{ matrix.service }}-trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Gate actionable image vulnerabilities
        run: >-
          python3 scripts/evaluate-image-scan.py ${{ matrix.service }}-trivy.json
          --test-reports .security-test-evidence
          --output ${{ matrix.service }}-vulnerability-disposition.json
      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.service }}-supply-chain
          if-no-files-found: ignore
          path: |
            ${{ matrix.service }}-sbom.spdx.json
            ${{ matrix.service }}-trivy.json
            ${{ matrix.service }}-vulnerability-disposition.json
