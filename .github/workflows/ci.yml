name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Invariant Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build, Test & Generate Coverage
        run: ./mvnw clean verify -Pcoverage --batch-mode

      - name: Archive Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  supply-chain:
    name: Images, SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - service: ledger
            dockerfile: deploy/Dockerfile.ledger
          - service: projection
            dockerfile: deploy/Dockerfile.projection
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ledgerline/${{ matrix.service }}:${{ github.sha }}
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ledgerline/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ matrix.service }}-sbom.spdx.json
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ledgerline/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: ${{ matrix.service }}-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload Trivy report to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.service }}-trivy.sarif
      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-supply-chain
          path: |
            ${{ matrix.service }}-sbom.spdx.json
            ${{ matrix.service }}-trivy.sarif
